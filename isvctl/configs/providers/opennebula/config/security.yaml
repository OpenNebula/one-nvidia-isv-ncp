# OpenNebula Security Validation Configuration
#
# Wires the OpenNebula XML-RPC endpoint to the provider-neutral API endpoint
# isolation contract. Audit logging checks require a readable local audit log
# file and retention-days evidence.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/opennebula/config/security.yaml

version: "1.0"

commands:
  security:
    phases: ["test"]
    steps:
      - name: api_endpoint_isolation
        phase: test
        command: "python3 ../scripts/security/api_endpoint_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
        timeout: 60

      - name: audit_logging_test
        phase: test
        command: "python3 ../scripts/security/audit_logging_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
          - "--audit-log-path"
          - "{{audit_log_path}}"
          - "--audit-retention-days"
          - "{{audit_retention_days}}"
          - "--poll-seconds"
          - "{{audit_poll_seconds}}"
          - "--xmlrpc-timeout-seconds"
          - "{{audit_xmlrpc_timeout_seconds}}"
        sensitive_args: ["--auth"]
        timeout: 90

tests:
  platform: security
  cluster_name: "opennebula-security-validation"
  description: "OpenNebula security validation"

  settings:
    region: "{{env.ONE_REGION | default('opennebula')}}"
    xmlrpc_url: "{{env.ONE_XMLRPC | default('http://localhost:2633/RPC2')}}"
    auth: "{{env.ONE_AUTH | default('oneadmin:opennebula')}}"
    audit_log_path: "{{env.ONE_AUDIT_LOG_PATH | default('', true)}}"
    audit_retention_days: "{{env.ONE_AUDIT_RETENTION_DAYS | default('0')}}"
    audit_poll_seconds: "{{env.ONE_AUDIT_POLL_SECONDS | default('20')}}"
    audit_xmlrpc_timeout_seconds: "{{env.ONE_AUDIT_XMLRPC_TIMEOUT_SECONDS | default('10')}}"

  validations:
    api_security:
      checks:
        ApiEndpointIsolationCheck:
          step: api_endpoint_isolation

    audit_log_entry:
      checks:
        AuditLogEntryCheck:
          step: audit_logging_test

    audit_log_retention:
      checks:
        AuditLogRetentionCheck:
          step: audit_logging_test

  exclude:
    labels: []
