# OpenNebula Security Validation Configuration
#
# Wires the OpenNebula XML-RPC endpoint to the provider-neutral API endpoint
# isolation contract. Audit logging checks require a readable local audit log
# file and retention-days evidence.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/opennebula/config/security.yaml

version: "1.0"

commands:
  security:
    phases: ["test"]
    steps:
      - name: bmc_management_network
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args: ["--region", "{{region}}", "--aspect", "bmc_management_network"]
        timeout: 60

      - name: bmc_tenant_isolation
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args: ["--region", "{{region}}", "--aspect", "bmc_tenant_isolation"]
        timeout: 60

      - name: bmc_protocol_security
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args: ["--region", "{{region}}", "--aspect", "bmc_protocol_security"]
        timeout: 60

      - name: bmc_bastion_access
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args: ["--region", "{{region}}", "--aspect", "bmc_bastion_access"]
        timeout: 60

      - name: api_endpoint_isolation
        phase: test
        command: "python3 ../scripts/security/api_endpoint_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
        timeout: 60

      - name: audit_logging_test
        phase: test
        command: "python3 ../scripts/security/audit_logging_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
          - "--audit-log-path"
          - "{{audit_log_path}}"
          - "--audit-retention-days"
          - "{{audit_retention_days}}"
          - "--poll-seconds"
          - "{{audit_poll_seconds}}"
          - "--xmlrpc-timeout-seconds"
          - "{{audit_xmlrpc_timeout_seconds}}"
        sensitive_args: ["--auth"]
        timeout: 90

      - name: insecure_protocols_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "insecure_protocols_test"
          - "--security-endpoint"
          - "{{security_endpoint}}"
        timeout: 60

      - name: mfa_enforcement
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args: ["--region", "{{region}}", "--aspect", "mfa_enforcement"]
        timeout: 60

      - name: cert_rotation_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "cert_rotation_test"
          - "--cert-rotation-days"
          - "{{cert_rotation_days}}"
        timeout: 60

      - name: kms_encryption_options_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "kms_encryption_options_test"
          - "--provider-key-id"
          - "{{provider_key_id}}"
          - "--customer-key-id"
          - "{{customer_key_id}}"
        timeout: 60

      - name: centralized_kms_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "centralized_kms_test"
          - "--provider-key-id"
          - "{{provider_key_id}}"
        timeout: 60

      - name: customer_managed_key_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "customer_managed_key_test"
          - "--customer-key-id"
          - "{{customer_key_id}}"
          - "--encrypted-resource-id"
          - "{{encrypted_resource_id}}"
        timeout: 60

      - name: sa_credential_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "sa_credential_test"
          - "--identity"
          - "{{security_identity}}"
        timeout: 60

      - name: oidc_user_auth_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "oidc_user_auth_test"
          - "--security-endpoint"
          - "{{security_endpoint}}"
          - "--oidc-issuer-url"
          - "{{oidc_issuer_url}}"
          - "--oidc-audience"
          - "{{oidc_audience}}"
        timeout: 60

      - name: short_lived_credentials_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "short_lived_credentials_test"
          - "--credential-ttl-seconds"
          - "{{credential_ttl_seconds}}"
          - "--max-ttl-seconds"
          - "{{max_ttl_seconds}}"
        timeout: 60

      - name: least_privilege_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "least_privilege_test"
          - "--identity"
          - "{{security_identity}}"
          - "--allowed-resource"
          - "{{allowed_resource}}"
          - "--allowed-source-cidr"
          - "{{allowed_source_cidr}}"
        timeout: 60

      - name: tenant_isolation_test
        phase: test
        command: "python3 ../scripts/security/security_contract_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--aspect"
          - "tenant_isolation_test"
          - "--tenant-a-id"
          - "{{tenant_a_id}}"
          - "--tenant-b-id"
          - "{{tenant_b_id}}"
        timeout: 60

tests:
  platform: security
  cluster_name: "opennebula-security-validation"
  description: "OpenNebula security validation"

  settings:
    region: "{{env.ONE_REGION | default('opennebula')}}"
    xmlrpc_url: "{{env.ONE_XMLRPC | default('http://localhost:2633/RPC2')}}"
    auth: "{{env.ONE_AUTH | default('oneadmin:opennebula')}}"
    audit_log_path: "{{env.ONE_AUDIT_LOG_PATH | default('/var/log/one/oned.log')}}"
    audit_retention_days: "{{env.ONE_AUDIT_RETENTION_DAYS | default('90')}}"
    audit_poll_seconds: "{{env.ONE_AUDIT_POLL_SECONDS | default('20')}}"
    audit_xmlrpc_timeout_seconds: "{{env.ONE_AUDIT_XMLRPC_TIMEOUT_SECONDS | default('10')}}"
    security_endpoint: "{{env.ONE_SECURITY_ENDPOINT | default('https://opennebula.internal')}}"
    security_identity: "{{env.ONE_SECURITY_IDENTITY | default('oneadmin')}}"
    cert_rotation_days: "{{env.ONE_CERT_ROTATION_DAYS | default('30')}}"
    provider_key_id: "{{env.ONE_PROVIDER_KEY_ID | default('opennebula-system-key')}}"
    customer_key_id: "{{env.ONE_CUSTOMER_KEY_ID | default('opennebula-customer-key')}}"
    encrypted_resource_id: "{{env.ONE_ENCRYPTED_RESOURCE_ID | default('opennebula-encrypted-datastore')}}"
    oidc_issuer_url: "{{env.ONE_OIDC_ISSUER_URL | default('https://issuer.opennebula.internal')}}"
    oidc_audience: "{{env.ONE_OIDC_AUDIENCE | default('opennebula')}}"
    credential_ttl_seconds: "{{env.ONE_CREDENTIAL_TTL_SECONDS | default('900')}}"
    max_ttl_seconds: "{{env.ONE_MAX_TTL_SECONDS | default('3600')}}"
    allowed_resource: "{{env.ONE_ALLOWED_RESOURCE | default('opennebula-template')}}"
    allowed_source_cidr: "{{env.ONE_ALLOWED_SOURCE_CIDR | default('127.0.0.1/32')}}"
    tenant_a_id: "{{env.ONE_TENANT_A_ID | default('opennebula-tenant-a')}}"
    tenant_b_id: "{{env.ONE_TENANT_B_ID | default('opennebula-tenant-b')}}"

  validations:
    bmc_management_network:
      checks:
        BmcManagementNetworkCheck:
          step: bmc_management_network

    bmc_isolation:
      checks:
        BmcTenantIsolationCheck:
          step: bmc_tenant_isolation

    bmc_protocol_security:
      checks:
        BmcProtocolSecurityCheck:
          step: bmc_protocol_security

    bmc_bastion_access:
      checks:
        BmcBastionAccessCheck:
          step: bmc_bastion_access

    api_security:
      checks:
        ApiEndpointIsolationCheck:
          step: api_endpoint_isolation

    audit_log_entry:
      checks:
        AuditLogEntryCheck:
          step: audit_logging_test

    audit_log_retention:
      checks:
        AuditLogRetentionCheck:
          step: audit_logging_test

    insecure_protocols:
      checks:
        InsecureProtocolsCheck:
          step: insecure_protocols_test

    mfa_enforcement:
      checks:
        MfaEnforcedCheck:
          step: mfa_enforcement

    cert_rotation:
      checks:
        CertRotationCycleCheck:
          step: cert_rotation_test

    kms_encryption_options:
      checks:
        KmsEncryptionOptionCheck:
          step: kms_encryption_options_test

    centralized_kms:
      checks:
        CentralizedKmsCheck:
          step: centralized_kms_test

    customer_managed_key:
      checks:
        CustomerManagedKeyCheck:
          step: customer_managed_key_test

    service_account_auth:
      checks:
        ServiceAccountCredentialCheck:
          step: sa_credential_test

    user_auth_oidc:
      checks:
        OidcUserAuthCheck:
          step: oidc_user_auth_test

    short_lived_credentials:
      checks:
        ShortLivedCredentialsCheck:
          step: short_lived_credentials_test

    least_privilege_policy:
      checks:
        LeastPrivilegePolicyCheck:
          step: least_privilege_test

    minimal_role_enforcement:
      checks:
        MinimalRoleEnforcementCheck:
          step: least_privilege_test

    tenant_isolation:
      checks:
        TenantIsolationCheck:
          step: tenant_isolation_test

  exclude:
    labels: []
