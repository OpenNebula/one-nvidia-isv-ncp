# OpenNebula Control Plane Validation Configuration
#
# Wires OpenNebula users to the provider-neutral access-key lifecycle contract
# and OpenNebula groups to the provider-neutral tenant lifecycle contract.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/opennebula/config/control-plane.yaml

version: "1.0"

commands:
  control_plane:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: create_access_key
        phase: setup
        command: "python3 ../scripts/control-plane/create_access_key.py"
        args:
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
        timeout: 60

      - name: create_tenant
        phase: setup
        command: "python3 ../scripts/control-plane/create_tenant.py"
        args:
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
        timeout: 60

      - name: test_access_key
        phase: test
        command: "python3 ../scripts/control-plane/test_access_key.py"
        args:
          - "--access-key-id"
          - "{{steps.create_access_key.access_key_id}}"
          - "--secret-access-key"
          - "{{steps.create_access_key.secret_access_key}}"
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--wait"
          - "1"
          - "--retries"
          - "5"
        sensitive_args: ["--secret-access-key"]
        timeout: 120

      - name: disable_access_key
        phase: test
        command: "python3 ../scripts/control-plane/disable_access_key.py"
        args:
          - "--username"
          - "{{steps.create_access_key.username}}"
          - "--access-key-id"
          - "{{steps.create_access_key.access_key_id}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
        timeout: 60

      - name: verify_key_rejected
        phase: test
        command: "python3 ../scripts/control-plane/verify_key_rejected.py"
        args:
          - "--access-key-id"
          - "{{steps.create_access_key.access_key_id}}"
          - "--secret-access-key"
          - "{{steps.create_access_key.secret_access_key}}"
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--wait"
          - "1"
          - "--retries"
          - "5"
        sensitive_args: ["--secret-access-key"]
        timeout: 120

      - name: list_tenants
        phase: test
        command: "python3 ../scripts/control-plane/list_tenants.py"
        args:
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
          - "--group-name"
          - "{{steps.create_tenant.tenant_name}}"
        timeout: 60

      - name: get_tenant
        phase: test
        command: "python3 ../scripts/control-plane/get_tenant.py"
        args:
          - "--group-name"
          - "{{steps.create_tenant.tenant_name}}"
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
        timeout: 60

      - name: delete_access_key
        phase: teardown
        command: "python3 ../scripts/control-plane/delete_access_key.py"
        args:
          - "--username"
          - "{{steps.create_access_key.username}}"
          - "--access-key-id"
          - "{{steps.create_access_key.access_key_id}}"
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
          - "{{teardown_flag}}"
        timeout: 60
        output_schema: teardown

      - name: delete_tenant
        phase: teardown
        command: "python3 ../scripts/control-plane/delete_tenant.py"
        args:
          - "--group-name"
          - "{{steps.create_tenant.tenant_name}}"
          - "--region"
          - "{{region}}"
          - "--xmlrpc-url"
          - "{{xmlrpc_url}}"
          - "--auth"
          - "{{auth}}"
          - "{{teardown_flag}}"
        timeout: 60
        output_schema: teardown

tests:
  platform: control_plane
  cluster_name: "opennebula-control-plane-validation"
  description: "OpenNebula control plane: access key and tenant lifecycle"

  settings:
    region: "{{env.ONE_REGION | default('opennebula')}}"
    xmlrpc_url: "{{env.ONE_XMLRPC | default('http://localhost:2633/RPC2')}}"
    auth: "{{env.ONE_AUTH | default('oneadmin:opennebula')}}"
    teardown_flag: "{{(env.ONE_CONTROL_PLANE_SKIP_TEARDOWN == 'true') | ternary('--skip-destroy', '')}}"

  validations:
    setup_checks:
      checks:
        AccessKeyCreatedCheck:
          step: create_access_key
        TenantCreatedCheck:
          step: create_tenant

    access_key_lifecycle:
      checks:
        AccessKeyAuthenticatedCheck:
          step: test_access_key
        AccessKeyDisabledCheck:
          step: disable_access_key
        AccessKeyRejectedCheck:
          step: verify_key_rejected

    tenant_lifecycle:
      checks:
        TenantListedCheck:
          step: list_tenants
        TenantInfoCheck:
          step: get_tenant

    teardown_checks:
      checks:
        StepSuccessCheck-delete_access_key:
          step: delete_access_key
        StepSuccessCheck-delete_tenant:
          step: delete_tenant

  exclude:
    labels: []
